services:
  - type: web
    name: campus-canvas
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: CEMS_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/college_events.db
    disk:
      name: campus-canvas-data
      mountPath: /var/data
      sizeGB: 1
